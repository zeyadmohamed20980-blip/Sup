<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Browser AI Model</title>
    <!-- Load TensorFlow.js from a CDN -->
    <script src="https://jsdelivr.net"></script>
</head>
<body>
    <h1>House Price Predictor AI</h1>
    <p>This AI model trains and runs entirely in your browser using TensorFlow.js!</p>
    
    <button onclick="trainModel()">1. Train Model</button>
    <br><br>
    <input type="number" id="sqftInput" placeholder="Enter Sq Ft (e.g., 2000)" disabled>
    <button id="predictBtn" onclick="predict()" disabled>2. Predict Price</button>
    <h3 id="result">Status: Click "Train Model" to begin.</h3>

    <script>
        let model;

        async function trainModel() {
            document.getElementById('result').innerText = "Training model... please wait...";
            
            // 1. Create a simple linear regression model
            model = tf.sequential();
            model.add(tf.layers.dense({units: 1, inputShape: [1]}));
            model.compile({loss: 'meanSquaredError', optimizer: 'sgd'});

            // 2. Generate dummy training data (X = Sq Ft / 1000, Y = Price in \$100k)
            const xs = tf.tensor2d([1.0, 1.5, 2.0, 2.5, 3.0], [5, 1]);
            const ys = tf.tensor2d([100, 150, 200, 250, 300], [5, 1]);

            // 3. Train the model
            await model.fit(xs, ys, {epochs: 200});
            
            document.getElementById('result').innerText = "Training complete! Ready for predictions.";
            document.getElementById('sqftInput').disabled = false;
            document.getElementById('predictBtn').disabled = false;
        }

        function predict() {
            const val = parseFloat(document.getElementById('sqftInput').value);
            if (isNaN(val)) return;

            // Normalize input matching the training data scaling
            const inputTensor = tf.tensor2d([val / 1000], [1, 1]);
            const prediction = model.predict(inputTensor);
            
            // Get data back from the tensor
            prediction.data().then(data => {
                const estimatedPrice = (data[0]).toFixed(2);
                document.getElementById('result').innerText = `Estimated Price: $${estimatedPrice}k`;
            });
        }
    </script>
</body>
</html>
