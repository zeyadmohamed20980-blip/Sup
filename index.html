<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Universal Cloud App Runner</title>
    <style>
        body { background-color: #121212; color: #ffffff; font-family: sans-serif; text-align: center; padding: 20px; }
        input, select, button { padding: 12px; margin: 8px; border-radius: 6px; border: 1px solid #444; font-size: 14px; }
        input { width: 350px; background: #222; color: #fff; }
        button { background-color: #238636; color: white; cursor: pointer; font-weight: bold; }
        button:hover { background-color: #2ea043; }
        .gallery { display: flex; flex-wrap: wrap; justify-content: center; gap: 15px; margin-top: 30px; }
        .frame { border: 3px solid #333; border-radius: 8px; width: 100%; max-width: 600px; background: #000; min-height: 200px; }
    </style>
</head>
<body>
    <h1>🚀 Universal Cloud App Executor</h1>
    <p>Upload or link any pre-compiled app binary to spin it up inside a cloud node execution block.</p>

    <div>
        <input type="text" id="fileUrl" placeholder="Paste direct .apk or .exe download URL here...">
        <select id="osType">
            <option value="apk">Android (.apk)</option>
            <option value="exe">Windows (.exe)</option>
        </select>
        <button onclick="triggerCloudRunner()">Execute Binary</button>
    </div>

    <div class="gallery">
        <div>
            <h3 id="statusText">Server Monitor View (Idle)</h3>
            <img id="monitor" class="frame" src="workspace_screenshots/frame_1.png" alt="Awaiting deployment trigger...">
        </div>
    </div>

    <script>
        // REPLACE THESE WITH YOUR EXACT REPOSITORY DETAILS
        const GH_USER = "YOUR_GITHUB_USERNAME"; 
        const GH_REPO = "YOUR_REPO_NAME";
        // To trigger workflows from a webpage, you need a GitHub Personal Access Token (Fine-grained or Classic)
        const REPO_PAT = "YOUR_GITHUB_PERSONAL_ACCESS_TOKEN"; 

        async function triggerCloudRunner() {
            const fileUrl = document.getElementById('fileUrl').value;
            const osType = document.getElementById('osType').value;
            if(!fileUrl) return alert("Please enter a valid application download link!");

            document.getElementById('statusText').innerText = "🔄 Spinning up server instance... Please wait.";

            const response = await fetch(`https://github.com{GH_USER}/${GH_REPO}/actions/workflows/external-runner.yml/dispatches`, {
                method: "POST",
                headers: {
                    "Authorization": `Bearer ${REPO_PAT}`,
                    "Accept": "application/vnd.github+json",
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    ref: "legacy", // Your branch name
                    inputs: { file_url: fileUrl, file_type: osType }
                })
            });

            if(response.ok) {
                alert("Cloud execution successfully requested! Stream connection starting.");
                startPolling();
            } else {
                alert("Failed to connect to runner API. Check your Token permissions.");
            }
        }

        function startPolling() {
            let count = 0;
            setInterval(() => {
                count++;
                document.getElementById('statusText').innerText = `📺 Live stream running (Update check #${count})`;
                document.getElementById('monitor').src = `workspace_screenshots/frame_1.png?t=` + new Date().getTime();
            }, 6000);
        }
    </script>
</body>
</html>
