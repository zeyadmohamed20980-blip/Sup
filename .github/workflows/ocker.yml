name: External Target Binary Runner

on:
  workflow_dispatch: # Triggered on demand by the web panel frontend

permissions:
  contents: write

jobs:
  run-saturn-apk:
    runs-on: macos-13 # Standard macOS nodes feature fast Android hardware acceleration out-of-the-box
    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        ref: legacy

    - name: Setup Android Ecosystem
      uses: android-actions/setup-android@v3

    - name: Spin up Hardware Accelerated Emulator and Run APK
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 33
        target: google_apis
        arch: x86_64
        script: |
          # 1. Block execution until the device completes booting sequences
          adb wait-for-device
          
          # 2. Sideload the APK file uploaded from your website form
          if [ -f "runtime_binaries/app_target.apk" ]; then
            adb install runtime_binaries/app_target.apk
          else
            echo "ERROR: Uploaded file missing from runtime storage directory!" && exit 1
          fi
          
          # 3. Launch Saturn Llepie package layout
          # Note: If your app uses a custom package ID, replace 'com.saturn.llepie' below with your package name!
          adb shell monkey -p com.saturn.llepie -c android.intent.category.LAUNCHER 1
          sleep 15 # Give the graphics window ample time to render asset configurations
          
          # 4. Snap layout configuration and route it to your webpage tracking directory
          mkdir -p workspace_screenshots
          adb shell screencap -p /sdcard/frame.png
          adb pull /sdcard/frame.png workspace_screenshots/frame_1.png

    - name: Push Screen Update directly onto Live Website
      uses: JamesIves/github-pages-deploy-action@v4
      with:
        folder: .
        branch: gh-pages
